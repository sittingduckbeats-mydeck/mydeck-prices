name: Pokémon-Galerie erzeugen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node fetch-pokemon.mjs
      - name: Speichern
        run: |
          git config user.name "mydeck-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add dex
          git diff --cached --quiet || git commit -m "Pokémon-Galerie aktualisiert"
          git push
