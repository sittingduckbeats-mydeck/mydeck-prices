name: Preise abrufen

on:
  schedule:
    - cron: "17 2 * * 1"   # jeden Montag 02:17 UTC
  workflow_dispatch: {}      # manuell startbar

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preise von TCGdex holen
        run: node fetch-prices.mjs
      - name: Ergebnis speichern
        run: |
          git config user.name "mydeck-bot"
          git config user.email "mydeck-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Preise $(date -u +%Y-%m-%d)"
          git push
