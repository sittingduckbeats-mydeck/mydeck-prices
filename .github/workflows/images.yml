name: Bilder abrufen
on:
  schedule:
    - cron: "37 3 1 * *"   # am 1. jedes Monats, neue Sets
  workflow_dispatch:
    inputs:
      force:
        description: "Alle Sets neu erzeugen (1 = ja)"
        default: "0"
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node fetch-images.mjs
        env:
          FORCE: ${{ github.event.inputs.force || '0' }}
      - name: Speichern
        if: always()
        run: |
          git config user.name "mydeck-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add img
          git diff --cached --quiet || git commit -m "Kartenbilder aktualisiert"
          git push
